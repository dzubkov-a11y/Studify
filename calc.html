<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Studify — Калькулятор балів</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Studify</h1>
            <p>Калькулятор середнього бала та статистика</p>

            <nav class="nav-menu">
    <a href="index.html" class="nav-btn">📅 План тижня</a>
    <a href="relax.html" class="nav-btn">🧘 Ментал-релакс</a>
    <a href="notes.html" class="nav-btn">📚 Нотатки</a>
    <a href="calc.html" class="nav-btn">🎯 Калькулятор балів</a>
    <a href="schedule.html" class="nav-btn">🔔 Уроки і дзвінки</a>
    <a href="flashcards.html" class="nav-btn">🃏 Картки</a>
</nav>

            <div class="theme-switcher">
                <button type="button" class="theme-btn active" data-theme="purple">🟣 Фіолетова</button>
                <button type="button" class="theme-btn" data-theme="orange">🟠 Оранжева</button>
                <button type="button" class="theme-btn" data-theme="blue">🔵 Синя</button>
                <button type="button" class="theme-btn" data-theme="cream">🟡 Біло-жовта</button>
            </div>
        </header>

        <section class="task-form-section">
            <h2>Додати оцінку</h2>
            <form id="calcForm">
                <select id="subjectInput" required>
                    <option value="">Обери предмет...</option>
                    <option value="Українська мова">Українська мова</option>
                    <option value="Українська література">Українська література</option>
                    <option value="Зарубіжна література">Зарубіжна література</option>
                    <option value="Алгебра">Алгебра</option>
                    <option value="Геометрія">Геометрія</option>
                    <option value="Історія України">Історія України</option>
                    <option value="Всесвітня історія">Всесвітня історія</option>
                    <option value="Англійська мова">Англійська мова</option>
                    <option value="Німецька мова">Німецька мова</option>
                    <option value="Фізика">Фізика</option>
                    <option value="Хімія">Хімія</option>
                    <option value="Біологія">Біологія</option>
                    <option value="Географія">Географія</option>
                    <option value="Інформатика">Інформатика</option>
                </select>
                <select id="gradeInput" required>
                    <option value="">Оцінка (1–12)...</option>
                    <option value="12">12</option>
                    <option value="11">11</option>
                    <option value="10">10</option>
                    <option value="9">9</option>
                    <option value="8">8</option>
                    <option value="7">7</option>
                    <option value="6">6</option>
                    <option value="5">5</option>
                    <option value="4">4</option>
                    <option value="3">3</option>
                    <option value="2">2</option>
                    <option value="1">1</option>
                </select>
                <button type="submit">Додати</button>
            </form>
        </section>

        <section class="board-section">
            <h2>Результат та стовпчикова статистика</h2>
            <div class="calc-result-box" id="resultBox">Середній бал: 0</div>

            <div class="stats-card">
                <h3>Стовпчикова діаграма оцінок (з 12)</h3>
                <div class="bar-chart" id="statsChart"></div>
            </div>

            <h2 style="margin-top: 28px;">Список оцінок</h2>
            <div class="board" id="gradesBoard"></div>
        </section>
    </div>

    <script src="js/calc.js"></script>
    <script src="js/theme.js"></script>
</body>
</html>
